<div class="w-96 my-8 px-8 flex gap-8">
  <dft-dropdown [multiple]="true" [data]="[{name:'test', value: 'test'}]"/>
  <dft-dropdown [data]="[{name:'test', value: 'test'}]"/>
</div>
<div class="flex gap-6 px-8">
  <button class="bg-blue-500 text-white px-2 h-8" (click)="showToast()">Show Toast</button>
  <button class="bg-blue-500 text-white px-2 h-8" (click)="showConfirm()">Show Confirm</button>
  <button class="bg-blue-500 text-white px-2 h-8" (click)="updateData()">Update Data</button>
  <button class="bg-blue-500 text-white px-2 h-8" (click)="updateHeaders()">Update Headers</button>
</div>
<div class="p-6">
  <dft-table [selectable]="true" [data]="dataSource" [headers]="headers" [sortable]="true" [paginate]="true"
             (dft-change)="dftChange($event)" [pages]="[2, 4, 6, 8]"/>
</div>

<router-outlet/>
<dft-toast/>
<dft-confirm/>

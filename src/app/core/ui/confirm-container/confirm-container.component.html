<div class="bg-white p-4 rounded-md">
  <div class="flex flex-col items-center p-5 bg-white rounded-md">
    <div class="bg-blue-500 rounded-full text-white inline-flex justify-center items-center h-24 w-24">
      <img src="/logos/diap.svg" alt="logo diap" class="pointer-events-none">
    </div>
    <span class="font-bold text-2xl block mb-2 mt-4 text-slate-700">
        {{ data.header }}
      </span>
    <p class="mb-0">{{ data.message }}</p>
    <div class="flex items-center gap-2 mt-4">
      <button class="w-32 bg-blue-500 text-white hover:bg-blue-700 cursor-pointer rounded-md h-8"
              (click)="dialogRef.close(true)">
        Aceptar
      </button>
      <button
        class="border-2 border-blue-500 text-blue-500 hover:bg-blue-500 hover:text-white w-32 cursor-pointer rounded-md h-8"
        (click)="dialogRef.close(false)">
        Cancelar
      </button>
    </div>
  </div>
</div>
